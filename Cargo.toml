[workspace]
members = ["crates/queries"]

[package]
name = "project-boards"
version = "0.5.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "View and manage GitHub Projects boards, or view Linear boards, as a table or kanban board."
repository = "https://github.com/tviles/project-boards"

[features]
live = ["project-boards-queries/live"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.13", features = ["json"] }
graphql_client = "0.16"
project-boards-queries = { path = "crates/queries" }
futures = "0.3"
ratatui = "0.30"
ratatui-textarea = "0.9"
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
shell-words = "1"

[dev-dependencies]
project-boards-queries = { path = "crates/queries", features = ["live"] }
insta = "1"
wiremock = "0.6"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
