# Every query project-boards sends. graphql_client validates each operation against
# schema.graphql (next to this file) at compile time.

fragment FieldRef on ProjectV2FieldConfiguration {
  __typename
  ... on ProjectV2Field { id }
  ... on ProjectV2SingleSelectField { id }
  ... on ProjectV2MultiSelectField { id }
  ... on ProjectV2IterationField { id }
}

fragment FieldConfig on ProjectV2FieldConfiguration {
  __typename
  ... on ProjectV2Field { id name dataType }
  ... on ProjectV2SingleSelectField { id name dataType options { id name color } }
  ... on ProjectV2MultiSelectField { id name dataType multiSelectOptions { id name color } }
  ... on ProjectV2IterationField {
    id name dataType
    configuration {
      iterations { id title startDate duration }
      completedIterations { id title startDate duration }
    }
  }
}

fragment ProjectSchemaFields on ProjectV2 {
  id number title url viewerCanUpdate
  owner { __typename ... on User { login } ... on Organization { login } }
  fields(first: 100) { nodes { ...FieldConfig } }
  views(first: 50) {
    nodes {
      id number name layout filter
      visibleFields(first: 50) { nodes { ...FieldRef } }
      groupByFields(first: 5) { nodes { ...FieldRef } }
      verticalGroupByFields(first: 5) { nodes { ...FieldRef } }
      sortByFields(first: 5) { nodes { direction field { ...FieldRef } } }
    }
  }
  repositories(first: 20) { nodes { id nameWithOwner } }
}

fragment ItemFields on ProjectV2Item {
  id type isArchived updatedAt
  # Labels, assignees, reviewers and linked PRs come from `content`, not from `fieldValues`:
  # GitHub scores a query by its `first:` arguments, and a connection nested inside
  # `fieldValues(first: 50)` under `items(first: 100)` costs 5,000 requests whether or not
  # it returns anything. One level up it costs 100.
  content {
    __typename
    # Card fields: plain objects, no connection, so they add nothing to the cost.
    ... on Issue {
      id number title url state stateReason repository { nameWithOwner }
      createdAt updatedAt closedAt
      issueType { name color }
      parent { number title state }
      subIssuesSummary { total completed }
      milestone { id title }
      labels(first: 20) { nodes { id name color } }
      assignees(first: 10) { nodes { id login } }
      closedByPullRequestsReferences(first: 5, includeClosedPrs: true) { nodes { number state isDraft } }
    }
    ... on PullRequest {
      id number title url state isDraft repository { nameWithOwner }
      createdAt updatedAt closedAt
      milestone { id title }
      labels(first: 20) { nodes { id name color } }
      assignees(first: 10) { nodes { id login } }
      reviewRequests(first: 10) { nodes { requestedReviewer { __typename ... on User { login } ... on Team { slug } } } }
    }
    ... on DraftIssue { id title assignees(first: 10) { nodes { id login } } }
  }
  fieldValues(first: 50) {
    nodes {
      __typename
      ... on ProjectV2ItemFieldTextValue { text field { ...FieldRef } }
      ... on ProjectV2ItemFieldNumberValue { number field { ...FieldRef } }
      ... on ProjectV2ItemFieldDateValue { date field { ...FieldRef } }
      ... on ProjectV2ItemFieldSingleSelectValue { optionId name field { ...FieldRef } }
      ... on ProjectV2ItemFieldMultiSelectValue { options { id name } field { ...FieldRef } }
      ... on ProjectV2ItemFieldIterationValue { iterationId title startDate field { ...FieldRef } }
      # No connection may be nested here (see above). These four only mark which field holds
      # the value; convert.rs reads the value itself from `content`.
      ... on ProjectV2ItemFieldLabelValue { field { ...FieldRef } }
      ... on ProjectV2ItemFieldUserValue { field { ...FieldRef } }
      ... on ProjectV2ItemFieldMilestoneValue { milestone { title } field { ...FieldRef } }
      ... on ProjectV2ItemFieldRepositoryValue { repository { nameWithOwner } field { ...FieldRef } }
      ... on ProjectV2ItemFieldPullRequestValue { field { ...FieldRef } }
      ... on ProjectV2ItemFieldReviewerValue { field { ...FieldRef } }
    }
  }
}

fragment ProjectSummaryFields on ProjectV2 {
  id number title closed
  owner { __typename ... on User { login } ... on Organization { login } }
}

query ResolveProject($owner: String!, $number: Int!) {
  user(login: $owner) { projectV2(number: $number) { ...ProjectSchemaFields } }
  organization(login: $owner) { projectV2(number: $number) { ...ProjectSchemaFields } }
}

query ProjectSchema($id: ID!) {
  node(id: $id) { __typename ... on ProjectV2 { ...ProjectSchemaFields } }
}

query ItemsPage($id: ID!, $first: Int!, $after: String, $query: String!) {
  node(id: $id) {
    __typename
    ... on ProjectV2 {
      items(first: $first, after: $after, query: $query) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes { ...ItemFields }
      }
    }
  }
}

# ItemsPage plus a dry-run cost, for the live cost test only. A dry run evaluates nothing.
query ItemsPageCost($id: ID!, $first: Int!, $after: String, $query: String!) {
  rateLimit(dryRun: true) { cost }
  node(id: $id) {
    __typename
    ... on ProjectV2 {
      items(first: $first, after: $after, query: $query) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes { ...ItemFields }
      }
    }
  }
}

query ViewItemIds($id: ID!, $first: Int!, $after: String, $query: String!) {
  node(id: $id) {
    __typename
    ... on ProjectV2 {
      items(first: $first, after: $after, query: $query) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes { id }
      }
    }
  }
}

query HydrateItems($ids: [ID!]!) {
  nodes(ids: $ids) { __typename ... on ProjectV2Item { ...ItemFields } }
}

query ItemDetail($id: ID!, $before: String) {
  node(id: $id) {
    __typename
    ... on ProjectV2Item {
      content {
        __typename
        ... on Issue {
          body
          issueType { name }
          parent { number title state }
          subIssues(first: 50) { nodes { number title state } }
          closedByPullRequestsReferences(first: 10, includeClosedPrs: true) { nodes { number title state } }
          comments(last: 20, before: $before) {
            totalCount
            pageInfo { hasPreviousPage startCursor }
            nodes { author { __typename login } createdAt body }
          }
        }
        ... on PullRequest {
          body
          closingIssuesReferences(first: 10) { nodes { number title state } }
          comments(last: 20, before: $before) {
            totalCount
            pageInfo { hasPreviousPage startCursor }
            nodes { author { __typename login } createdAt body }
          }
        }
        ... on DraftIssue { body }
      }
    }
  }
}

query RepoProjects($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) { projectsV2(first: 50) { nodes { ...ProjectSummaryFields } } }
}

query ViewerProjects {
  viewer {
    login
    projectsV2(first: 100) { nodes { ...ProjectSummaryFields } }
    organizations(first: 100) { nodes { login projectsV2(first: 100) { nodes { ...ProjectSummaryFields } } } }
  }
}

query Viewer { viewer { login } }

# --- Mutations: project field values and positions (0.2) -----------------------------------
# One operation per value type, with scalar variables: GitHub's ProjectV2FieldValue takes
# exactly one value, so no other key may be sent, not even as null. Each returns the item as
# GitHub now has it, which goes straight into the confirmed board: the item index lags
# writes by over a minute (phase 0 finding 0).

mutation SetTextValue($project: ID!, $item: ID!, $field: ID!, $text: String!) {
  updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {text: $text}}) {
    projectV2Item { ...ItemFields }
  }
}

mutation SetNumberValue($project: ID!, $item: ID!, $field: ID!, $number: Float!) {
  updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {number: $number}}) {
    projectV2Item { ...ItemFields }
  }
}

mutation SetDateValue($project: ID!, $item: ID!, $field: ID!, $date: Date!) {
  updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {date: $date}}) {
    projectV2Item { ...ItemFields }
  }
}

mutation SetSingleSelectValue($project: ID!, $item: ID!, $field: ID!, $option: String!) {
  updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}}) {
    projectV2Item { ...ItemFields }
  }
}

mutation SetMultiSelectValue($project: ID!, $item: ID!, $field: ID!, $options: [String!]!) {
  updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {multiSelectOptionIds: $options}}) {
    projectV2Item { ...ItemFields }
  }
}

mutation SetIterationValue($project: ID!, $item: ID!, $field: ID!, $iteration: String!) {
  updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {iterationId: $iteration}}) {
    projectV2Item { ...ItemFields }
  }
}

mutation ClearFieldValue($project: ID!, $item: ID!, $field: ID!) {
  clearProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field}) {
    projectV2Item { ...ItemFields }
  }
}

# `after: null` moves the item to the top. The payload lists the project's items in their
# new order (ids only); the live suite checks the move with it.
mutation UpdateItemPosition($project: ID!, $item: ID!, $after: ID) {
  updateProjectV2ItemPosition(input: {projectId: $project, itemId: $item, afterId: $after}) {
    items(first: 100) { nodes { id } }
  }
}

mutation AddDraftIssue($project: ID!, $title: String!, $body: String!) {
  addProjectV2DraftIssue(input: {projectId: $project, title: $title, body: $body}) {
    projectItem { ...ItemFields }
  }
}

mutation DeleteItem($project: ID!, $item: ID!) {
  deleteProjectV2Item(input: {projectId: $project, itemId: $item}) { deletedItemId }
}

# --- Mutations: issues, pull requests and drafts (0.3) -------------------------------------
# Title, body and milestone each have their own operation, so setting one never sends null
# for another (a null milestoneId clears the milestone).

mutation AddAssignees($id: ID!, $users: [ID!]!) {
  addAssigneesToAssignable(input: {assignableId: $id, assigneeIds: $users}) { clientMutationId }
}

mutation RemoveAssignees($id: ID!, $users: [ID!]!) {
  removeAssigneesFromAssignable(input: {assignableId: $id, assigneeIds: $users}) { clientMutationId }
}

mutation AddLabels($id: ID!, $labels: [ID!]!) {
  addLabelsToLabelable(input: {labelableId: $id, labelIds: $labels}) { clientMutationId }
}

mutation RemoveLabels($id: ID!, $labels: [ID!]!) {
  removeLabelsFromLabelable(input: {labelableId: $id, labelIds: $labels}) { clientMutationId }
}

mutation UpdateIssueTitle($id: ID!, $title: String!) {
  updateIssue(input: {id: $id, title: $title}) { issue { id } }
}

mutation UpdateIssueBody($id: ID!, $body: String!) {
  updateIssue(input: {id: $id, body: $body}) { issue { id } }
}

mutation SetIssueMilestone($id: ID!, $milestone: ID) {
  updateIssue(input: {id: $id, milestoneId: $milestone}) { issue { id } }
}

mutation UpdatePullRequestTitle($id: ID!, $title: String!) {
  updatePullRequest(input: {pullRequestId: $id, title: $title}) { pullRequest { id } }
}

mutation UpdatePullRequestBody($id: ID!, $body: String!) {
  updatePullRequest(input: {pullRequestId: $id, body: $body}) { pullRequest { id } }
}

mutation SetPullRequestMilestone($id: ID!, $milestone: ID) {
  updatePullRequest(input: {pullRequestId: $id, milestoneId: $milestone}) { pullRequest { id } }
}

mutation UpdateDraftTitle($id: ID!, $title: String!) {
  updateProjectV2DraftIssue(input: {draftIssueId: $id, title: $title}) { draftIssue { id } }
}

mutation UpdateDraftBody($id: ID!, $body: String!) {
  updateProjectV2DraftIssue(input: {draftIssueId: $id, body: $body}) { draftIssue { id } }
}

mutation SetDraftAssignees($id: ID!, $users: [ID!]!) {
  updateProjectV2DraftIssue(input: {draftIssueId: $id, assigneeIds: $users}) { draftIssue { id } }
}

mutation AddComment($subject: ID!, $body: String!) {
  addComment(input: {subjectId: $subject, body: $body}) { clientMutationId }
}

mutation CloseIssue($id: ID!, $reason: IssueClosedStateReason!) {
  closeIssue(input: {issueId: $id, stateReason: $reason}) { issue { id } }
}

mutation ReopenIssue($id: ID!) {
  reopenIssue(input: {issueId: $id}) { issue { id } }
}

mutation ClosePullRequest($id: ID!) {
  closePullRequest(input: {pullRequestId: $id}) { pullRequest { id } }
}

mutation ReopenPullRequest($id: ID!) {
  reopenPullRequest(input: {pullRequestId: $id}) { pullRequest { id } }
}

# --- Mutations: project items (0.3) --------------------------------------------------------

mutation AddItemById($project: ID!, $content: ID!) {
  addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { ...ItemFields } }
}

mutation CreateIssue($repo: ID!, $title: String!, $body: String!) {
  createIssue(input: {repositoryId: $repo, title: $title, body: $body}) { issue { id } }
}

mutation ConvertDraft($item: ID!, $repo: ID!) {
  convertProjectV2DraftIssueItemToIssue(input: {itemId: $item, repositoryId: $repo}) { item { ...ItemFields } }
}

mutation ArchiveItem($project: ID!, $item: ID!) {
  archiveProjectV2Item(input: {projectId: $project, itemId: $item}) { item { id } }
}

mutation UnarchiveItem($project: ID!, $item: ID!) {
  unarchiveProjectV2Item(input: {projectId: $project, itemId: $item}) { item { id } }
}

# --- Lookups for the editors (0.3) ---------------------------------------------------------
# Cost (nodes requested / 100, rounded up, minimum 1): RepoCandidates 1+100+100+50 = 251 -> 3;
# PushableRepos 1+1+100 = 102 -> 2; RepoLookup 1; SearchContent 1+20 = 21 -> 1; ContentByNumber 1.

query RepoCandidates($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    id
    assignableUsers(first: 100) { nodes { id login } }
    labels(first: 100) { nodes { id name color } }
    milestones(first: 50, states: [OPEN], orderBy: {field: DUE_DATE, direction: ASC}) { nodes { id title } }
  }
}

query PushableRepos {
  viewer {
    repositories(first: 100, affiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER],
                 ownerAffiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER],
                 isArchived: false, orderBy: {field: PUSHED_AT, direction: DESC}) {
      nodes { id nameWithOwner viewerPermission hasIssuesEnabled }
    }
  }
}

query RepoLookup($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) { id nameWithOwner viewerPermission hasIssuesEnabled }
}

query SearchContent($query: String!) {
  search(query: $query, type: ISSUE, first: 20) {
    nodes {
      __typename
      ... on Issue { id number title state repository { nameWithOwner } }
      ... on PullRequest { id number title state repository { nameWithOwner } }
    }
  }
}

query ContentByNumber($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    issueOrPullRequest(number: $number) {
      __typename
      ... on Issue { id number title state repository { nameWithOwner } }
      ... on PullRequest { id number title state repository { nameWithOwner } }
    }
  }
}
